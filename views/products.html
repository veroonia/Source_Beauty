<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products – Source Beauty</title>
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/products-catalog.css">
</head>

<body>
    <div class="topbar">Free shipping over 1500 EGP • 30-day returns</div>

    <header>
        <div class="container header-inner">
            <h1 class="logo">Source Beauty</h1>
            <div id="site-nav"></div>
        </div>
    </header>

    <!-- ═══════════════ PRODUCTS CATALOG ═══════════════ -->
    <div class="products-catalog-wrapper">
        <div class="container">
            <div class="breadcrumb">
                <a href="home.html">Home</a> / <span>All Products</span>
            </div>

            <div class="catalog-grid">
                <!-- ─────── SIDEBAR FILTERS ─────── -->
                <aside class="filter-sidebar">
                    <div class="filter-header">
                        <h3>Filter Options</h3>
                        <a href="#" class="clear-filters">Clear All</a>
                    </div>

                    <!-- Categories -->
                    <div class="filter-group">
                        <h4>By Categories</h4>
                        <div class="filter-options">
                            <label class="filter-checkbox">
                                <input type="checkbox" name="category" value="skincare">
                                <span>Skin Care</span>
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="category" value="makeup">
                                <span>Makeup</span>
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="category" value="haircare">
                                <span>Hair Care</span>
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="category" value="fragrance">
                                <span>Fragrances</span>
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="category" value="nailcare">
                                <span>Nail Care</span>
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="category" value="bodycare">
                                <span>Body Care</span>
                            </label>
                        </div>
                    </div>

                    <!-- Skin Type -->
                    <div class="filter-group">
                        <h4>By Skin Type</h4>
                        <div class="filter-options">
                            <label class="filter-checkbox">
                                <input type="checkbox" name="skintype" value="normal">
                                <span>Normal</span>
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="skintype" value="oily">
                                <span>Oily</span>
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="skintype" value="dry">
                                <span>Dry</span>
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="skintype" value="combination">
                                <span>Combination</span>
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="skintype" value="sensitive">
                                <span>Sensitive</span>
                            </label>
                        </div>
                    </div>

                    <!-- Price Range -->
                    <div class="filter-group">
                        <h4>Price Range</h4>
                        <div class="price-slider-container">
                            <input type="range" min="0" max="3000" value="3000" step="50" class="price-slider" id="priceSlider">
                            <div class="price-inputs">
                                <span>Up to</span>
                                <strong id="priceValue">3000 EGP</strong>
                            </div>
                        </div>
                    </div>


                    <!-- Promotions -->
                    <div class="filter-group">
                        <h4>By Promotions</h4>
                        <div class="filter-options">
                            <label class="filter-checkbox">
                                <input type="checkbox" name="promotion" value="new">
                                <span>New Arrivals</span>
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="promotion" value="bestseller">
                                <span>Best Sellers</span>
                            </label>
                            <label class="filter-checkbox">
                                <input type="checkbox" name="promotion" value="sale">
                                <span>On Sale</span>
                            </label>
                        </div>
                    </div>

                    <button type="button" class="apply-filters-btn">Apply Filters</button>

                </aside>

                <!-- ─────── MAIN PRODUCTS AREA ─────── -->
                <main class="products-main">
                    <!-- Active Filters & Sort -->
                    <div class="products-toolbar">
                        <div class="active-filters">
                            <span class="filter-label">Active Filter:</span>
                            <span class="active-filter-status" id="activeFilterStatus">Applied</span>
                            <div class="filter-tags"></div>
                        </div>
                        <div class="sort-container">
                            <label>Sort by :</label>
                            <select class="sort-select">
                                <option>Default Sorting</option>
                                <option>Price: Low to High</option>
                                <option>Price: High to Low</option>
                                <option>Newest</option>
                                <option>Best Seller</option>
                                <option>Highest Rated</option>
                            </select>
                        </div>
                    </div>

                    <div class="results-info">
                        <p><span class="results-count" id="resultsCount">0</span> products shown</p>
                    </div>

                    <!-- Product Grid -->
                    <div class="products-grid" aria-live="polite"></div>
                </main>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="site-footer"></div>

    <script src="../js/product-data.js"></script>
    <script src="../js/home.js"></script>
    <script src="../js/products.js"></script>
</body>

</html>
